{% extends 'base.html' %}

{% block title %}Resend Verification Email - AMStack{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-indigo-50 via-white to-purple-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md mx-auto">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-900">Resend Verification Email</h2>
            <p class="mt-2 text-sm text-gray-600">
                Enter your email address and we'll send you a new verification link.
            </p>
        </div>

        <div class="bg-white py-8 px-6 shadow-xl rounded-lg">
            <form method="post" action="{% url 'accounts:resend_verification' %}">
                {% csrf_token %}
                
                <div class="mb-6">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        Email Address
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                        placeholder="your@email.com"
                    >
                </div>

                <button 
                    type="submit"
                    class="w-full bg-indigo-600 text-white py-3 px-4 rounded-lg hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 transition duration-150 font-medium"
                >
                    Send Verification Email
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="{% url 'accounts:login' %}" class="text-sm text-indigo-600 hover:text-indigo-500">
                    Back to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
